# docker compose up → app em http://localhost:8501 e API em http://localhost:8000 (/docs)
# Única configuração obrigatória: GOOGLE_API_KEY no arquivo .env (copie de .env.example).
# As portas ficam só em 127.0.0.1: a interface não tem login. Para expor a API, defina API_KEY.
services:
  app:
    build: .
    image: assistente-dados
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - path: .env
        required: false
    volumes:
      - llm-cache:/app/.cache
      - traces:/app/traces
    restart: unless-stopped

  api:
    image: assistente-dados
    depends_on:
      - app  # same image, built once by the app service
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"  # API_PORT=8010 docker compose up, se a 8000 estiver ocupada
    healthcheck:  # the image's own check targets the Streamlit port
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    env_file:
      - path: .env
        required: false
    volumes:
      - llm-cache:/app/.cache
      - traces:/app/traces
    restart: unless-stopped

volumes:
  llm-cache:
  traces:

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions fixadas por SHA do commit (a tag só no comentário): uma tag pode ser movida, o SHA não.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependências
        run: make install
      # Lint, formatação, mypy estrito e testes. Os testes usam um LLM falso: não precisam de chave.
      - name: make check
        run: make check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # Sem chave na CI. Com LLM_CACHE=replay o assistente monta sem chamar o Gemini; com o padrão
      # (on) e sem GOOGLE_API_KEY, a api responde 503 no /health e o container fica unhealthy.
      - name: Configurar sem chave
        run: echo "LLM_CACHE=replay" > .env
      - name: Subir o compose
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Conferir /health da API e do app
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health | tee health.json
          python3 -c "import json, re; h = json.load(open('health.json')); assert h['status'] == 'ok' and re.fullmatch('[0-9a-f]{8}', h['prompt_version']), h"
          curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Derrubar
        if: always()
        run: docker compose down --volumes

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions fixadas por SHA do commit (a tag só no comentário): uma tag pode ser movida, o SHA não.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependências
        run: make install
      # Lint, formatação, mypy estrito e testes. Os testes usam um LLM falso: não precisam de chave.
      - name: make check
        run: make check

  # O caminho do README numa máquina limpa: o Python do sistema (sem setup-python) e só o que o README pede.
  clean-ubuntu:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Python do sistema, ainda sem o pacote do venv
        run: apt-get update -qq && apt-get install -y -qq python3 make
      - name: make install recusa e diz o que instalar
        run: |
          if make install 2> erro.txt; then echo "make install devia falhar sem python3.12-venv"; exit 1; fi
          cat erro.txt
          grep -F "apt install python3.12-venv" erro.txt
      - name: Instalar o pacote que o README pede
        run: apt-get install -y -qq python3.12-venv
      - name: make install
        run: make install
      - name: make check
        run: make check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # Sem chave na CI. Com LLM_CACHE=replay o assistente monta sem chamar o Gemini e responde do
      # cache publicado da demo; com o padrão (on) e sem GOOGLE_API_KEY, o /health responde 503.
      - name: Configurar sem chave
        run: printf 'LLM_CACHE=replay\nLLM_CACHE_DIR=/app/demo/llm-cache\n' > .env
      - name: Subir o compose
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Conferir /health da API e do app
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health | tee health.json
          python3 -c "import json, re; h = json.load(open('health.json')); assert h['status'] == 'ok' and re.fullmatch('[0-9a-f]{8}', h['prompt_version']), h"
          curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health
      - name: Responder uma pergunta da demo sem chave
        run: |
          curl --fail --silent --show-error -X POST http://127.0.0.1:8000/ask -H 'Content-Type: application/json' \
            -d '{"question": "Liste os 5 estados com maior número de clientes que compraram via app em maio."}' > ask.json
          python3 -c "import json; r = json.load(open('ask.json')); assert r['status'] == 'answered' and r['llm_calls'] > 0 and r['cache_hits'] == r['llm_calls'], r"
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Derrubar
        if: always()
        run: docker compose down --volumes
